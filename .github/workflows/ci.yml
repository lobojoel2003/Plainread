name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check --output-format=github src tests scripts
      - name: Ruff (format)
        run: ruff format --check src tests scripts
      - name: Mypy (strict)
        run: mypy
      - name: JavaScript syntax
        run: node --check src/plainread/web/app.js
      - name: Release metadata is consistent
        run: |
          python scripts/release_notes.py --check "v$(python -c 'import plainread; print(plainread.__version__)')"

  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Tesseract OCR
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -m "not slow and not e2e" --cov --cov-report=xml --cov-report=term
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  quality:
    name: Quality gates (sample letters)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: pip install -e .
      - name: Text mode (must meet thresholds)
        run: plainread eval --json eval-text.json --details
      - name: Photo / OCR mode (must meet thresholds)
        run: plainread eval --ocr --json eval-ocr.json
      - name: Held-out letters (report only, never tuned on)
        if: hashFiles('eval/holdout/*.json') != ''
        run: plainread eval --letters eval/holdout --json eval-holdout.json --details --no-fail
      - name: Write summary
        if: always()
        run: python scripts/eval_summary.py eval-*.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-report
          path: eval-*.json
          retention-days: 30

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,e2e]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m e2e tests/e2e

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - name: Stamp build number
        run: python scripts/stamp_build.py --build-number "${{ github.run_number }}" --commit "${{ github.sha }}"
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Smoke test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/plainread --version
          /tmp/smoke/bin/plainread --version | grep -q "build ${{ github.run_number }}"
          printf 'Date: March 2, 2026\n\nYou must pay $40.00 by March 20, 2026.\n' | /tmp/smoke/bin/plainread explain - --json --today 2026-03-05 | grep -q payment_due
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: plainread:ci
          build-args: |
            BUILD_NUMBER=${{ github.run_number }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name plainread -p 127.0.0.1:8765:8765 plainread:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health > health.json; then break; fi
            sleep 1
          done
          cat health.json
          python3 -c "import json; h = json.load(open('health.json')); assert h['status'] == 'ok' and h['ocr']['available'], h"
          curl -fsS -X POST http://127.0.0.1:8765/api/explain/text -H 'content-type: application/json' \
            -d '{"text": "Date: March 2, 2026\n\nPlease pay $40.00 by March 20, 2026.", "today": "2026-03-05"}' | grep -q payment_due
          docker rm -f plainread
