[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "plainread"
dynamic = ["version"]
description = "Explain hard letters from courts, hospitals, insurers and benefits offices in plain language — privately, on your own device."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Joel Stain Lobo" }]
keywords = [
  "plain-language",
  "accessibility",
  "ocr",
  "tesseract",
  "ollama",
  "privacy",
  "offline",
  "literacy",
  "legal-aid",
  "fastapi",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Healthcare Industry",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "pillow>=10.2",
  "pytesseract>=0.3.10",
  "pypdfium2>=4.28",
  "httpx>=0.27",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
  "twine>=5.0",
]
e2e = ["playwright>=1.45"]
bundle = ["pyinstaller>=6.6"]

[project.scripts]
plainread = "plainread.cli:main"

[project.urls]
Homepage = "https://github.com/lobojoel2003/Plainread"
Repository = "https://github.com/lobojoel2003/Plainread"
Issues = "https://github.com/lobojoel2003/Plainread/issues"
Changelog = "https://github.com/lobojoel2003/Plainread/blob/main/CHANGELOG.md"
Releases = "https://github.com/lobojoel2003/Plainread/releases"

[tool.hatch.version]
path = "src/plainread/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/plainread"]
# _build.py is generated by scripts/stamp_build.py in CI and is git-ignored,
# so it must be listed explicitly to end up in the wheel.
artifacts = ["src/plainread/_build.py"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "eval",
  "scripts",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
]
artifacts = ["src/plainread/_build.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not e2e'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
  "ocr: needs the Tesseract OCR engine installed",
  "e2e: drives the web app in a real browser (needs Playwright)",
  "slow: takes more than a few seconds",
]

[tool.coverage.run]
source = ["plainread"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "S", "N"]
ignore = [
  "E501",   # line length is handled by `ruff format`; long regex literals stay readable
  "S101",   # assert is fine in tests
  "S603",   # subprocess calls are deliberate
  "S607",
  "RUF001", # letters legitimately contain typographic quotes and dashes
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.10"
packages = ["plainread"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pytesseract", "pypdfium2", "pypdfium2.*", "plainread._build"]
ignore_missing_imports = true
